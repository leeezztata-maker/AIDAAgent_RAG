[project]
name = "ai-data-analysis-agent"
version = "0.1.0"
description = "Portfolio-ready AI data analysis agent with FastAPI, Streamlit, Pandas, and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "plotly>=5.24.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "openai>=1.40.0",
  "langgraph>=0.2.14",
  "requests>=2.32.3",
  "streamlit>=1.37.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "httpx>=0.27.0",
  "ruff>=0.6.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
